      <form id="login-form" class="space-y-4" novalidate>
        <!-- Campo Correo Electrónico -->
        <div>
          <div class="mb-1.5 flex items-center justify-between text-xs">
            <label for="email" class="font-semibold text-gray-800 dark:text-gray-200">Correo electrónico</label>
            <button type="button" data-toast="Seleccionar usuario" class="font-medium text-[#7A5970] hover:underline dark:text-[#b58da9]">Elija un usuario</button>
          </div>
          <input
            id="email"
            type="email"
            placeholder="usuario@tuempresa.com"
            class="w-full rounded border border-gray-200 bg-[#EDF2FA] px-3 py-2 text-sm text-gray-900 placeholder-gray-400 transition-colors focus:border-[#6B4C62] focus:bg-white focus:outline-none dark:border-zinc-700 dark:bg-zinc-800 dark:text-white"
          />
        </div>

        <!-- Campo Contraseña -->
        <div>
          <div class="mb-1.5 flex items-center justify-between text-xs">
            <label for="password" class="font-semibold text-gray-800 dark:text-gray-200">Contraseña</label>
            <button type="button" data-toast="Recuperación de contraseña" class="font-medium text-[#7A5970] hover:underline dark:text-[#b58da9]">Restablecer contraseña</button>
          </div>
          <div class="relative flex items-center">
            <input
              id="password"
              type="password"
              placeholder="••••"
              class="w-full rounded border border-gray-200 bg-[#EDF2FA] py-3 pr-12 pl-3 text-sm text-gray-900 placeholder-gray-400 transition-colors focus:border-[#6B4C62] focus:bg-white focus:outline-none dark:border-zinc-700 dark:bg-zinc-800 dark:text-white"
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-1.5 flex size-7 items-center justify-center rounded border border-gray-200 bg-white text-gray-600 shadow-sm hover:text-gray-900"
              aria-label="Mostrar u ocultar contraseña"
            >
              <!-- icono ojo (se intercambia por JS) -->
              <svg data-icon="eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg data-icon="eye-off" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden size-4"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <!-- Botón Principal -->
        <div class="pt-2">
          <button
            type="submit"
            id="submit-btn"
            class="w-full cursor-pointer rounded bg-[#6B4C62] px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-[#583e50] active:bg-[#493242] disabled:cursor-not-allowed disabled:opacity-60"
          >
            Iniciar sesión
          </button>
        </div>
      </form>

      <!-- Enlace de registro -->
      <div class="mt-4 text-center">
        <button type="button" data-toast="Formulario de registro" class="text-xs font-medium text-[#7A5970] hover:underline dark:text-[#b58da9]">¿No tienes una cuenta?</button>
      </div>

      <!-- Separador -->
      <div class="my-4 flex items-center justify-center gap-2 text-xs text-gray-400">
        <span>- o -</span>
      </div>

      <!-- Botón secundario: Llave de acceso -->
      <button
        type="button"
        data-toast="Autenticación con Passkey"
        class="flex w-full cursor-pointer items-center justify-start gap-2.5 rounded border border-gray-200 bg-white px-4 py-2 text-xs font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-zinc-700 dark:bg-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-gray-600 dark:text-gray-300"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
        <span>Usa una llave de acceso</span>
      </button>

      <!-- Pie de tarjeta -->
      <div class="mt-7 text-center">
        <p class="text-[11px] text-gray-400">
          Con la tecnología de
          <span class="font-medium text-[#7A5970] dark:text-[#b58da9]">Odoo</span>
        </p>
      </div>
    </main>
  </div>

  <script>
    // Suite privada a la que se redirige tras registrar el acceso.
    const URL_SUITE_PRIVADA = 'http://89.167.20.163:8080';

    // --- Toast mínimo ---
    const toastRoot = document.getElementById('toast-root');
    function toast(msg, isError) {
      const el = document.createElement('div');
      el.className = 'toast' + (isError ? ' error' : '');
      el.textContent = msg;
      toastRoot.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 250);
      }, 2500);
    }

    // Botones informativos (igual que los toast del original)
    document.querySelectorAll('[data-toast]').forEach((b) =>
      b.addEventListener('click', () => toast(b.dataset.toast))
    );

    // Mostrar / ocultar contraseña
    const passwordInput = document.getElementById('password');
    const eye = document.querySelector('[data-icon="eye"]');
    const eyeOff = document.querySelector('[data-icon="eye-off"]');
    document.getElementById('toggle-password').addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      eye.classList.toggle('hidden', show);
      eyeOff.classList.toggle('hidden', !show);
    });

    // Envío del formulario
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        toast('Por favor ingresa tus credenciales', true);
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Iniciando sesión…';
      // Registra el acceso (solo el identificador + fecha/hora) para que la suite
      // privada lo sincronice. La contraseña NO se envía. Un fallo no bloquea el acceso.
      try {
        await fetch('/api/v1/reforzamiento/acceso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identificador: email }),
        });
      } catch {
        /* "mejor esfuerzo"; continuamos al privado */
      }
      window.location.href = URL_SUITE_PRIVADA;
    });
  </script>
</body>
