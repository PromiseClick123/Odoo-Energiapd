<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cargando…</title>
  <style>
    :root { --bg: #0f172a; --fg: #e2e8f0; --accent: #f59e0b; --track: #1e293b; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box { text-align: center; padding: 16px; }
    .spinner {
      width: 56px; height: 56px; margin: 0 auto 24px;
      border: 5px solid var(--track); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
    p { opacity: .75; }
    .bar { width: min(280px, 80vw); height: 6px; margin: 20px auto 0; background: var(--track); border-radius: 3px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); animation: fill var(--dur) linear forwards; }
    a { color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fill { to { width: 100%; } }
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Cargando…</h1>
    <p>Serás redirigido en <span id="count">4</span> segundos</p>
    <div class="bar"><div></div></div>
  </main>

  <script>
    // ⚙️ Configura aquí el destino y la duración
    const REDIRECT_URL = "https://reforzamiento.energiapd.com";
    const SECONDS = 4;

    document.documentElement.style.setProperty("--dur", SECONDS + "s");
    const countEl = document.getElementById("count");
    let left = SECONDS;
    countEl.textContent = left;

    const tick = setInterval(() => {
      left--;
      countEl.textContent = Math.max(left, 0);
      if (left <= 0) {
        clearInterval(tick);
        window.location.replace(REDIRECT_URL);
      }
    }, 1000);
  </script>
</body>
</html>
